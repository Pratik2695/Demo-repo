<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Page</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #0f172a, #2563eb);
        color: #ffffff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(8px);
        padding: 2.5rem 3rem;
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        text-align: center;
        max-width: 500px;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 2.2rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: #e2e8f0;
      }

      .btn {
        display: inline-block;
        margin-top: 1.25rem;
        padding: 0.8rem 1.2rem;
        background: #ffffff;
        color: #0f172a;
        text-decoration: none;
        font-weight: bold;
        border-radius: 999px;
        transition: transform 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-2px);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Welcome to Our Site</h1>
      <p>We’re excited to have you here. This is a simple and polished welcome page to get you started.</p>
      <a href="#" class="btn">Get Started</a>
    </div>
  </body>
</html>
